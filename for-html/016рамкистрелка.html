<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    .border1 {
      border: outset 8px #99f;
      width: 200px;
      height: 100px;
      margin-bottom: 30px;
    }
       .border2 {
      border: ridge 8px #99f;
      width: 200px;
      height: 100px;
      margin-bottom: 30px;
    }
       .border3 {
      border-style: double dashed solid ridge;
      border-width: 6px 3px 4px 8px;
      border-color: red green blue pink;
      width: 200px;
      height: 100px;
      margin-bottom: 30px;
    }
     .border4 {
      border-style: solid;
      border-width: 20px 0 20px 100px;
      border-color: transparent transparent transparent palevioletred;
      width: 0;
      height: 0;
      margin-bottom: 30px;
    }
      .border5 {
      border: outset 8px #99f;
      border-radius: 20px 40px / 40px 20px;
      width: 200px;
      height: 100px;
      margin-bottom: 30px;
    }
       .border6 {
      border-style: solid;
      border-width: 32px;
      border-image: url(img/border-192x192x64.jpg) 64 round;
      width: 300px;
      height: 200px;
      margin-bottom: 30px;
    }
      .border7 {
      border-style: solid;
      border-width: 60px;
      border-image: url(img/border1-132px.png) 132 round;
      width: 500px;
      height: 300px;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>
<h1>Рамки</h1>
<div class="border1"></div>
<div class="border2"></div>
<div class="border3"></div>
<div class="border4"></div>
<div class="border5"></div>
<div class="border6"></div>
<div class="border7"></div>
</body>

</html>
