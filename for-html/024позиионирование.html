<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    .cl1 {
      width: 300px;
      height: 200px;
      border-radius: 16px;
      border-style: solid;
      border-color: red;
      background-color: #fdd;
      position: absolute;
      left: 10px;
      top: 10px;
    }
      .cl2 {
      width: 300px;
      height: 200px;
      border-radius: 16px;
      border-style: solid;
      border-color: green;
      background-color: aquamarine;
      position: absolute;
      left: 110px;
      top: 80px;
    }
      .cl3 {
      width: 300px;
      height: 200px;
      border-radius: 16px;
      border-style: solid;
      border-color: blue;
      background-color: cornflowerblue;
      position: absolute;
      left: 210px;
      top: 150px;
    }
    .cl1:hover, .cl2:hover {
      z-index: 5;
    }
  </style>
</head>

<body>
<div class="cl1"></div>
<div class="cl2"></div>
<div class="cl3"></div>

</body>
</html>
