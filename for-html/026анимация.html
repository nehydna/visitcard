<html>
<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    h1 {
      transition: 1s;
    }
    h1:hover {
      color: chartreuse;
    }
    .btn {
      width: 120px;
      height: 30px;
      border: solid 2px gray;
      border-radius: 10px;
      text-align: center;
      line-height: 30px;
      background-image: url(icomoon/PNG/16px/0001-home.png);
      background-repeat: no-repeat;
      background-position: -20px center;
      color: black;
      box-sizing: border-box;
      transition: 1s;

    .btn:hover {
      background-position: 15px center;
      padding-left: 30px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.7) inset;
    }
