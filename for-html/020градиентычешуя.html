<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    .gr1 {
      width: 300px;
      height: 200px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: radial-gradient(black, white);
    }
     .gr2 {
      width: 300px;
      height: 200px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: radial-gradient(circle 100px at 33% 33%, black 99%, white);
    }
      .gr3 {
      width: 300px;
      height: 200px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: radial-gradient(circle 100px at 33% 33%, transparent 75%, red 80%, red 95%, transparent),
      radial-gradient(circle 100px at 67% 67%, transparent 75%, blue 80%, blue 95%, transparent);
    }
      .gr4 {
      width: 400px;
      height: 300px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: radial-gradient(circle 50px at left bottom, yellow 99%, transparent),
      radial-gradient(circle 50px at right bottom, yellow 99%, transparent),
      radial-gradient(circle 50px at center center, red 99%, yellow);
      background-size: 100px 100px;
    }
  </style>
</head>

<body>
<h1>Радиальные градиенты</h1>
<div class="gr1"></div>
<div class="gr2"></div>
<div class="gr3"></div>
<div class="gr4"></div>
</body>
</html>
