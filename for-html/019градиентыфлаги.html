<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    .gr1 {
      width: 200px;
      height: 100px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: linear-gradient(to right top, red, blue, green);
    }
     .gr2 {
      width: 400px;
      height: 100px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: linear-gradient(to right, red, orange, yellow, green, cyan, blue, purple);
    }
     .gr3 {
      width: 200px;
      height: 100px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: linear-gradient(to right top, white 74%, black 75%);
    }
    .ru {
      width: 200px;
      height: 100px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: linear-gradient(to top, red 33%, blue 33%, blue 67%, white 67%);
    }
     .uk {
      width: 200px;
      height: 100px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: linear-gradient(to right top, #007 34%, #fff 35%, #fff 39%, #f00 40%, #f00 49%, #fff 50%, #fff 59%, #007 60%),
      linear-gradient(to right bottom, #007 34%, #fff 35%, #fff 39%, #f00 40%, #f00 49%, #fff 50%, #fff 59%, #007 60%),
       linear-gradient(to left top, #007 34%, #fff 35%, #fff 39%, #f00 40%, #f00 49%, #fff 50%, #fff 59%, #007 60%),
      linear-gradient(to left bottom, #007 34%, #fff 35%, #fff 39%, #f00 40%, #f00 49%, #fff 50%, #fff 59%, #007 60%),
      linear-gradient(to right, transparent 45%, #f00 45%, #f00 55%, transparent 55%),
      linear-gradient(to bottom, #fff 45%, #f00 45%, #f00 55%, #fff 55%);
      background-position: left top, right top, left bottom, right bottom;
      background-size: 40% 40%, 40% 40%, 40% 40%, 40% 40%,  100% 100%, 100% 100%;
      background-repeat: no-repeat;
    }
     .gr4 {
      width: 200px;
      height: 100px;
      border: solid 1px grey;
      margin-bottom: 30px;
      background-image: repeating-linear-gradient(to right, #fff, #000 10%, #fff 30%);
    }
  </style>
</head>

<body>
<h1>Градиенты</h1>
<h3>Линейный градиент</h3>
<div class="gr1"></div>
<div class="gr2"></div>
<div class="gr3"></div>
<div class="ru"></div>
<div class="uk"></div>
<div class="gr4"></div>
</body>

</html>
