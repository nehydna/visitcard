<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    header, nav, .page, aside, .example, footer {
      border: solid 1px grey;
      padding: 5px;
      background-color: bisque;
    }
    main {
      display: flex;
        flex-wrap: wrap;
    }
    nav {
      flex-basis: 100%;
      flex-shrink: 0;
    }
    aside {
      flex-basis: 100%;
      flex-shrink: 0;
    }
    .page {
      flex-grow: 1;
    }
    .example {
         flex-basis: 150px; 
      }
  </style>
</head>

<body>

<main>
  <nav>Меню пример длинного текста</nav>
  <div class="page">Содержимое страницы</div>
  <div class="example">что-нибудь еще</div>
  <aside>Боковая колонка</aside>
</main>
<footer>Авторские права</footer>

</body>
</html>
