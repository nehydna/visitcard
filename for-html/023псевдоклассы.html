<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    a:link {
      font-size: 150%;
      text-decoration: none;
      border-bottom: dashed 2px;
      color: green;
    }
    a:visited {
      color: gray;
    }
    a:hover {
      color: red;
    }
    a:active {
      color: yellow;
    }
    h1:hover {
      letter-spacing: 10px;
    }
    ol li {
      border-bottom: solid 2px red;
      list-style-position: inside;
    }
    ol :last-child {
      border-style: none;
    }
    ol :nth-child(3n-1) {
      background-color: gainsboro;
    }
  </style>
</head>

<body>
<h1>Псевдоклассы</h1>
<a href="#">Тестовая ссылка</a>

</ol>

</body>
</html>
