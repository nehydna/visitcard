<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Untitled Document</title>
  <style>
    .shadow1 {
      width: 200px;
      height: 100px;
      background-color: aquamarine;
      : 10px -5px 10px 5px rgba(0, 0, 0, 0.7);
      margin: 50px;
    }
     .shadow2 {
      width: 200px;
      height: 100px;
      background-color: yellow;
      box-shadow: 0 0 1px 5px red,
        0 0 1px 10px green,
        0 0 1px 15px blue;
      margin: 50px;
    }
      .shadow3 {
      width: 200px;
      height: 100px;
      background-color: grey;
      box-shadow: 7px 7px 10px rgba(255,255,255,0.5) inset, -7px -7px 10px rgba(0, 0, 0, 0.5) inset,
      3px 3px 7px rgba(0, 0, 0, 0.5);
      border-radius: 15px;
      margin: 50px;
    }
      .shadow4 {
      width: 200px;
      height: 100px;
      background-color: blue;
      box-shadow: 7px 7px 10px rgba(255,255,255,0.5) inset, -7px -7px 10px rgba(0, 0, 0, 0.5) inset,
      3px 3px 7px rgba(0, 0, 0, 0.5);
      border-radius: 15px;
      margin: 50px;
      font-size: 40px;
      text-align: center;
      line-height: 100px;
        color: blue;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.9);
    }
  </style>
</head>

<body>
<h1>Тени</h1>
<div class="shadow1"></div>
<div class="shadow2"></div>
<div class="shadow3"></div>
<div class="shadow4">КНОПКА</div>
</body>
</html>
