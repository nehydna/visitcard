<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Untitled Document</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div class="container">
        <header id="header" class="header"></header>
        <div class="content-block">
            <div class="content-notes">
                <h2>My portfolio</h2>
                <h3>Примеры верстки по макетам PSD</h3>
                <div class="galery">
                    <div class="photos">

                        <a href="invite/indexINV.html" target="_blank"><img src="img/invite.PNG" alt=""
                                title="simple page" class="photos-active"> </a>

                        <a href="desktop/pex.html" target="_blank"> <img src="img/pex.PNG" alt=""
                                title="шаблон для тренировки был предоставлен HTML-академией"></a>

                        <a href="yoga/yoga.html" target="_blank"> <img src="img/yoga.PNG" alt=""
                                title="шаблон для тренировки был предоставлен HTML-академией"></a>


                        <a href="mestore/MeStore.html" target="_blank"><img src="img/mestore.PNG" alt=""
                                title="шаблон для тренировки был предоставлен HTML-академией"></a>


                    </div>
                    <div class="buttons">
                        <button type='submit' class="prev"></button>
                        <button type="submit" class="next"></button>
                    </div>
                </div>

            </div>
        </div>

        <footer id="footer"></footer>
    </div>
    <script>
        fetch('./header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки шапки:', error));

        fetch('./footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки footer:', error));
    </script>
    <script src="b.js"></script>
</body>

</html>
